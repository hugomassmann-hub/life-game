<!DOCTYPE html>
<html>
<head>
    <title>Life Game</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="manifest" href="manifest.json">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>

<div id="homePage">

    <div class="mobile-top">
        <div id="mobileLevel">Level 1</div>
        <div id="mobileXP">XP: 0</div>
    </div>

    <h1>🎮 LIFE GAME</h1>

    <h2>Your Character</h2>

    <div class="character-card">

        <div class="character" id="character">

            <div id="characterStreak">🔥 0 Day Streak</div>

            <div class="character-image-wrap">
                <img src="Level 1.png" alt="Your character">
            </div>

        </div>

        <div class="character-info">

            <h2 id="characterLevel">
                Level 7
            </h2>

            <p>
                Your journey is just beginning.
            </p>

        </div>

        <div class="mobile-buttons">

            <button onclick="openQuests()">🎯 Quests</button>

            <button id="customizeButton">
                👕 Customize
            </button>

            <button>👥 Feed</button>

            <button>🎒 Items</button>

            <button>🏆 Achievements</button>

            <button>⚙️ Settings</button>

        </div>

    </div>

    <div id="map"></div>

    <h2 id="levelText">Level 1</h2>

    <p id="xpText">XP: 0 / 350</p>

    <div class="xp">
        <div class="xp-bar"></div>
    </div>

    <p id="streakText">🔥 0 Day Streak</p>

    <h2>Today's Quests</h2>

    <div class="quest" id="commonQuest"></div>

    <div class="quest" id="uncommonQuest"></div>

    <div class="quest" id="rareQuest"></div>

</div>


<div id="questPage" class="quest-page">

    <button onclick="closeQuests()">
        ← Back
    </button>

    <h1>🎯 Quests</h1>

    <div class="quest" id="pageCommonQuest"></div>

    <div class="quest" id="pageUncommonQuest"></div>

    <div class="quest" id="pageRareQuest"></div>

</div>


<!-- CUSTOMIZE PAGE -->

<div id="customizePage" class="customize-page">

    <button id="backButton" onclick="closeCustomize()">
        ← Back
    </button>

    <h1>Customize</h1>

    <div class="customize-character">

        <div class="character-image-wrap" id="customizeCharacter">

            <img src="Level 1.png" alt="Your character">

        </div>

    </div>


    <div class="customize-items">

        <h2>Items</h2>

        <div id="itemsContainer"></div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="script.js"></script>

</body>
</html>
